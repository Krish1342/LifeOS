[project]
name = "lifeos"
version = "0.1.0"
description = "Personal AI operations layer coordinating everyday services via A2A protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.140.0",
    "slack-sdk>=3.31.0",
    "aiohttp>=3.10.0",
    "pyjwt>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0"
]

[project.scripts]
lifeos = "lifeos.cli.main:cli"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "BLE001",  # Allow catching blind Exception for offline network/DB fallbacks
    "S110",    # Allow try-except-pass in fallback attempts
    "SIM102",  # Nested if statements
    "UP007",   # Union type syntax
    "S104",    # Binding to 0.0.0.0
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
