version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - lifeos-net

  orchestrator:
    build: .
    command: uvicorn lifeos.agents.orchestrator.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-lifeos}
      - LIFEOS_ENCRYPTION_KEY=${LIFEOS_ENCRYPTION_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    depends_on:
      - mongodb
    networks:
      - lifeos-net

  calendar:
    build: .
    command: uvicorn lifeos.agents.calendar.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - LIFEOS_ENCRYPTION_KEY=${LIFEOS_ENCRYPTION_KEY}
    depends_on:
      - mongodb
    networks:
      - lifeos-net

  email:
    build: .
    command: uvicorn lifeos.agents.email.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - LIFEOS_ENCRYPTION_KEY=${LIFEOS_ENCRYPTION_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    depends_on:
      - mongodb
    networks:
      - lifeos-net

  file:
    build: .
    command: uvicorn lifeos.agents.file.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - LIFEOS_ENCRYPTION_KEY=${LIFEOS_ENCRYPTION_KEY}
    depends_on:
      - mongodb
    networks:
      - lifeos-net

  task:
    build: .
    command: uvicorn lifeos.agents.task.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - LIFEOS_ENCRYPTION_KEY=${LIFEOS_ENCRYPTION_KEY}
    depends_on:
      - mongodb
    networks:
      - lifeos-net

  notification:
    build: .
    command: uvicorn lifeos.agents.notification.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
    networks:
      - lifeos-net

volumes:
  mongo-data:

networks:
  lifeos-net:
    driver: bridge
